server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smartbuild-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/smartbuild_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:smartbuild}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    enabled: ${AI_ENABLED:true}
