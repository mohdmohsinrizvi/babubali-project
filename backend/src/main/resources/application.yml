server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smartbuild-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartbuild_db}
    username: ${DB_USERNAME:smartbuild}
    password: ${DB_PASSWORD:}          # defaults to an empty string; supply DB_PASSWORD or PostgreSQL rejects the login
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
